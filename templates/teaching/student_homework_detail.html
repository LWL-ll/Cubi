{% extends 'teaching/student_base.html' %}

{% block title %}作业详情 - 学生工作台{% endblock %}

{% block content %}
{# 返回列表 #}
<a href="{% url 'student_homeworks' %}" class="btn btn-outline-secondary btn-sm mb-3">← 返回作业列表</a>

{# 作业信息头 #}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0" id="hwTitle">📝 加载中…</h4>
    <div id="hwBadges"></div>
</div>
<div class="small text-secondary mb-3" id="hwMeta"></div>

<div class="row g-3">
    {# 左列：题目列表（展开答题） #}
    <div class="col-lg-8" id="problemList"></div>

    {# 右列：我的提交（轮询刷新） #}
    <div class="col-lg-4">
        <div class="card border-0 rounded-4 shadow-sm">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-3">📤 我的提交</h6>
                <div id="submissionList" class="text-secondary">加载中…</div>
            </div>
        </div>
    </div>
</div>

{# markdown 渲染库（题面渲染；CDN 不可用时降级为纯文本展示） #}
<script src="https://cdn.bootcdn.net/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const HOMEWORK_ID = {{ homeworkId }};

// HTML 转义：题面以外的服务端文本一律转义防 XSS
function esc(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
}

function formatTime(iso) {
    const date = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
           `${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

// 判题状态 -> 展示文案与颜色（与后端 STATUS_CHOICES 对齐）
const STATUS_LABELS = {
    queued:             {text: '排队中',   color: 'text-bg-secondary'},
    running:            {text: '判题中',   color: 'text-bg-info'},
    accepted:           {text: '通过',     color: 'text-bg-success'},
    wrong_answer:       {text: '答案错误', color: 'text-bg-danger'},
    compile_error:      {text: '编译错误', color: 'text-bg-warning'},
    time_limit_exceeded:{text: '超时',     color: 'text-bg-danger'},
    memory_limit_exceeded: {text: '内存超限', color: 'text-bg-danger'},
    output_limit_exceeded: {text: '输出超限', color: 'text-bg-danger'},
    runtime_error:      {text: '运行错误', color: 'text-bg-danger'},
    repeat:             {text: '重复提交', color: 'text-bg-secondary'},
    system_error:       {text: '系统错误', color: 'text-bg-dark'},
};
// 终态集合（轮询停止条件）
const TERMINAL = new Set(['accepted', 'wrong_answer', 'compile_error',
    'time_limit_exceeded', 'memory_limit_exceeded', 'output_limit_exceeded',
    'runtime_error', 'repeat', 'system_error']);

let homeworkDetail = null;
let pollTimer = null;

function statusBadge(status) {
    const item = STATUS_LABELS[status] || {text: status, color: 'text-bg-light'};
    return `<span class="badge ${item.color}">${item.text}</span>`;
}

function renderMarkdown(mdText) {
    // marked 可用时渲染为 HTML；CDN 失败降级纯文本（不信任浏览器渲染裸 HTML）
    if (window.marked) {
        return window.marked.parse(mdText);
    }
    return `<pre class="text-wrap small mb-0">${esc(mdText)}</pre>`;
}

async function loadDetail() {
    const res = await fetch(`/api/homeworks/${HOMEWORK_ID}/`);
    if (!res.ok) {
        document.getElementById('hwTitle').textContent = '作业不存在或尚未开始';
        document.getElementById('problemList').innerHTML = '';
        document.getElementById('submissionList').textContent = '';
        return;
    }
    homeworkDetail = await res.json();
    renderHeader();
    renderProblems();
    renderSubmissions();
    schedulePoll();
}

// 作业三态徽章（与列表页一致）
const HW_STATUS_BADGES = {
    pending_start: {text: '未开始', color: 'text-bg-secondary'},
    ongoing:       {text: '进行中', color: 'text-bg-success'},
    closed:        {text: '已截止', color: 'text-bg-danger'},
};

function renderHeader() {
    const hw = homeworkDetail;
    document.getElementById('hwTitle').textContent = '📝 ' + hw.title;
    document.getElementById('hwMeta').textContent =
        `🕐 ${formatTime(hw.startAt)} ~ ${formatTime(hw.deadline)} · ${hw.problems.length} 道题`;
    const badge = HW_STATUS_BADGES[hw.status] || HW_STATUS_BADGES.ongoing;
    document.getElementById('hwBadges').innerHTML =
        `<span class="badge ${badge.color}">${badge.text}</span>`;
}

function renderProblems() {
    const container = document.getElementById('problemList');
    const closed = homeworkDetail.status === 'closed';
    if (!homeworkDetail.problems.length) {
        container.innerHTML = '<div class="text-secondary">该作业暂无题目</div>';
        return;
    }
    container.innerHTML = homeworkDetail.problems.map((problem, index) => {
        // 语言选项：只显示题目允许的语言
        const languageOptions = problem.languages.map(lang =>
            `<option value="${esc(lang)}">${lang === 'c' ? 'C' : 'Python'}</option>`).join('');
        // 样例展示：输入/输出对照
        const sampleBlocks = (problem.samples || []).map(sample => `
            <div class="row g-2 mb-2">
                <div class="col-md-6">
                    <div class="small text-secondary">输入</div>
                    <pre class="border rounded p-2 small bg-light mb-0">${esc(sample.input)}</pre>
                </div>
                <div class="col-md-6">
                    <div class="small text-secondary">输出</div>
                    <pre class="border rounded p-2 small bg-light mb-0">${esc(sample.output)}</pre>
                </div>
            </div>`).join('');
        return `
        <div class="card border-0 rounded-4 shadow-sm mb-3">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold mb-0">${index + 1}. ${esc(problem.title)}</h6>
                </div>
                <div class="problem-statement small">${renderMarkdown(problem.statementMd)}</div>
                ${sampleBlocks ? `<hr><div class="small fw-bold text-secondary mb-2">样例</div>${sampleBlocks}` : ''}
                <hr>
                <div class="small fw-bold text-secondary mb-2">作答</div>
                <div class="row g-2 mb-2">
                    <div class="col-md-4">
                        <select class="form-select form-select-sm" id="lang-${problem.id}">
                            ${languageOptions}
                        </select>
                    </div>
                </div>
                <textarea class="form-control font-monospace" rows="8" id="code-${problem.id}"
                          placeholder="在这里粘贴你的代码…"></textarea>
                <div id="error-${problem.id}" class="alert alert-danger py-2 mt-2 mb-0 small d-none"></div>
                ${closed ? '<div class="small text-danger mt-2">作业已截止，无法提交</div>' : ''}
                <button class="btn btn-primary btn-sm mt-2" ${closed ? 'disabled' : ''}
                        onclick="submitCode(${problem.id})">提交代码</button>
            </div>
        </div>`;
    }).join('');
}

function renderSubmissions() {
    const container = document.getElementById('submissionList');
    const submissions = homeworkDetail.mySubmissions || [];
    if (!submissions.length) {
        container.innerHTML = '<div class="text-secondary py-2">还没有提交记录</div>';
        return;
    }
    // problemId -> 题目标题映射（展示用）
    const titleById = {};
    (homeworkDetail.problems || []).forEach(p => { titleById[p.id] = p.title; });
    container.innerHTML = submissions.map(s => {
        const scoreHtml = TERMINAL.has(s.status)
            ? `<span class="small text-secondary ms-2">${s.score} / ${s.totalScore} 分</span>` : '';
        return `
        <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <div>
                <div class="small fw-bold">${esc(titleById[s.problemId] || '题目')}</div>
                <div class="small text-secondary">${formatTime(s.createdAt)}</div>
            </div>
            <div class="text-end">
                ${statusBadge(s.status)}${scoreHtml}
            </div>
        </div>`;
    }).join('');
}

// 存在未终态提交时每 2 秒轮询刷新（判题进度展示）
function schedulePoll() {
    clearTimeout(pollTimer);
    const hasPending = (homeworkDetail.mySubmissions || [])
        .some(s => !TERMINAL.has(s.status));
    if (hasPending) {
        pollTimer = setTimeout(loadDetail, 2000);
    }
}

async function submitCode(problemId) {
    const errorBox = document.getElementById('error-' + problemId);
    errorBox.classList.add('d-none');
    const code = document.getElementById('code-' + problemId).value;
    const language = document.getElementById('lang-' + problemId).value;
    if (!code.trim()) { errorBox.textContent = '请先输入代码'; errorBox.classList.remove('d-none'); return; }
    const res = await apiFetch('/api/submissions/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            problemId: problemId,
            submitType: 'homework',
            homeworkId: HOMEWORK_ID,
            language: language,
            code: code,
        }),
    });
    if (res.ok) { loadDetail(); return; }
    const data = await res.json().catch(() => ({}));
    errorBox.textContent = apiErrorMessage(data, '提交失败：' + res.status);
    errorBox.classList.remove('d-none');
}

loadDetail();
</script>

<style>
    /* 题面渲染样式：markdown 输出的代码块/列表保持可读 */
    .problem-statement pre {
        background: #f8f9fa; border: 1px solid #e9ecef;
        border-radius: 0.375rem; padding: 0.6rem 0.75rem;
        white-space: pre-wrap; word-break: break-all;
    }
    .problem-statement code { color: #d63384; }
    .problem-statement pre code { color: inherit; }
</style>
{% endblock %}
