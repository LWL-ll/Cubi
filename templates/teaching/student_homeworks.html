{% extends 'teaching/student_base.html' %}

{% block title %}我的作业 - 学生工作台{% endblock %}

{% block content %}
<h4 class="fw-bold mb-3">📝 我的作业</h4>

{# 状态筛选 Tab：全部 / 未开始 / 进行中 / 已截止 #}
<ul class="nav nav-pills mb-3" id="homeworkFilter">
    <li class="nav-item">
        <button class="nav-link active" data-filter="all">全部</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" data-filter="pending_start">未开始</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" data-filter="ongoing">进行中</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" data-filter="closed">已截止</button>
    </li>
</ul>

{# 作业卡片列表（数据源：GET /api/homeworks/，12.4） #}
<div id="homeworkList" class="text-center text-secondary py-3">加载中…</div>

<script>
// HTML 转义：作业标题/教师名来自服务端数据，一律转义防 XSS
function esc(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
}

function formatTime(iso) {
    const date = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
           `${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

// 状态徽章配置：status -> {文案, 颜色, 提示}
const STATUS_BADGES = {
    pending_start: {text: '未开始',   color: 'text-bg-secondary', tip: '开始后可查看题目'},
    ongoing:       {text: '进行中',   color: 'text-bg-success',   tip: '请在截止前完成并提交'},
    closed:        {text: '已截止',   color: 'text-bg-danger',    tip: '该作业已过截止时间'},
};

let allHomeworks = [];
let currentFilter = 'all';

async function loadHomeworks() {
    const res = await fetch('/api/homeworks/');
    const container = document.getElementById('homeworkList');
    if (!res.ok) { container.textContent = '加载失败（' + res.status + '）'; return; }
    allHomeworks = await res.json();
    renderHomeworks(currentFilter);
}

// 渲染作业卡片列表（按状态筛选 + 我的提交概况）
function renderHomeworks(filter) {
    const filtered = filter === 'all' ? allHomeworks
        : allHomeworks.filter(h => h.status === filter);
    const container = document.getElementById('homeworkList');
    if (!filtered.length) {
        container.innerHTML = '<div class="text-secondary py-3">当前筛选条件下没有作业</div>';
        return;
    }
    container.innerHTML = filtered.map(h => {
        const badge = STATUS_BADGES[h.status] || {text: h.status, color: 'text-bg-light', tip: ''};
        const detailUrl = '{% url "student_homework_detail" 0 %}'.replace('/0', '/' + h.id);
        // 我的提交概况：已提交显示最高分，未提交显示待提交
        const submitHtml = h.mySubmitCount > 0
            ? `<span class="badge text-bg-light border ms-1">最高分 ${h.myBestScore}</span>`
            : `<span class="badge text-bg-light border ms-1">未提交</span>`;
        return `
        <a href="${detailUrl}" class="text-decoration-none">
            <div class="card border-0 rounded-4 shadow-sm mb-3 homework-card">
                <div class="card-body py-3 d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fw-bold text-dark">${esc(h.title)}</div>
                        <div class="small text-secondary mt-1">
                            ${esc(h.teacherName)} · ${h.problemCount} 题
                            · ${formatTime(h.startAt)} ~ ${formatTime(h.deadline)}
                        </div>
                    </div>
                    <div class="text-end">
                        <span class="badge ${badge.color}">${badge.text}</span>${submitHtml}
                        <div class="small text-secondary mt-1">${badge.tip}</div>
                    </div>
                </div>
            </div>
        </a>`;
    }).join('');
}

// 筛选 Tab 切换（点击高亮 + 按状态过滤）
document.getElementById('homeworkFilter').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    document.querySelectorAll('#homeworkFilter .nav-link').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderHomeworks(currentFilter);
});

loadHomeworks();
</script>

<style>
    /* 作业卡片悬浮效果：轻微上浮，提示可点击进入详情 */
    .homework-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .homework-card:hover { transform: translateY(-2px); box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.08) !important; }
</style>
{% endblock %}
