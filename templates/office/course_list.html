{% extends 'office/base_office.html' %}

{% block title %}课程管理 - 教务工作台{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">课程管理</h4>
    <a href="{% url 'office_import' %}" class="btn btn-primary btn-sm">📥 去导入课程</a>
</div>
<div class="card shadow-sm">
    <table class="table table-hover align-middle mb-0">
        <thead>
            <tr>
                <th>课程编号</th>
                <th>课程名称</th>
                <th>开设学院数</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
            <tr>
                <td>{{ course.code }}</td>
                <td class="fw-bold">{{ course.name }}</td>
                <td><span class="badge text-bg-secondary">{{ course.course_colleges.count }}</span></td>
                <td>
                    <a href="{% url 'office_course_detail' course.id %}" class="btn btn-sm btn-outline-primary">课程设置</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center text-secondary py-4">还没有课程，先去批量导入吧</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
