# go-judge 沙箱实例 nginx 限源配置模板（M8 部署契约，docs/OJ对接设计.md 14.3）
#
# 部署位置：沙箱服务器（oj.liuwenli.cn 所在机）的 nginx 站点配置
# 使用方式：把 <应用服务器IP> 替换为 codemind 应用服务器公网/内网 IP（可多条 allow）
#          其余公网流量一律 403；/config 建议直接关闭或仅限应用服务器
#
# 红线（14.3）：
#   1. /config 关闭或限源（泄露沙箱 cgroup/路径配置会暴露攻击面）
#   2. /run、/file 仅应用服务器可达（防公网滥用判题算力）
#   3. 部署验收强制验证 cgroup 启用，失败即拒绝启动判题（不降级运行）

# 应用服务器出口 IP 白名单（按实际部署替换，支持多条 allow 叠加）
geo $sandbox_allowed {
    default 0;
    <应用服务器IP> 1;   # 例如 127.0.0.1 1;（同机部署时）
}

server {
    listen 443 ssl;
    server_name oj.liuwenli.cn;

    # SSL 证书路径按实际部署填写（与既有站点配置合并，勿重复配置）
    # ssl_certificate     /etc/nginx/certs/oj.liuwenli.cn.pem;
    # ssl_certificate_key /etc/nginx/certs/oj.liuwenli.cn.key;

    # ---- 判题接口：仅应用服务器可达（公网一律 403） ----
    location /run {
        if ($sandbox_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:5050;
        proxy_read_timeout 60s;
        client_max_body_size 16m;   # 代码/测试点上传上限（copyIn 内容走请求体）
    }

    location /file {
        if ($sandbox_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:5050;
        proxy_read_timeout 30s;
        client_max_body_size 16m;
    }

    # ---- 沙箱配置端点：泄露攻击面，建议直接关闭（或仅应用服务器） ----
    location /config {
        # 方案 A（推荐）：验收后直接关闭
        return 404;
        # 方案 B：需要巡检时仅放行应用服务器
        # if ($sandbox_allowed = 0) { return 403; }
        # proxy_pass http://127.0.0.1:5050;
    }

    # ---- 其他路径：默认 403（go-judge 无其余公开端点） ----
    location / {
        return 403;
    }
}
